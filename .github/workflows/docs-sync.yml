name: Sync repository documentation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs-sources.json, scripts/sync-docs.py]

permissions:
  contents: read

concurrency:
  group: federated-documentation-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -p 'test_sync_docs.py'
      - name: Refresh public repository snapshots
        run: python3 scripts/sync-docs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 scripts/check-docs.py
      - name: Publish the generated snapshot
        run: |
          if git diff --quiet -- data/federated/catalog.json; then
            echo "Documentation is unchanged."
            exit 0
          fi
          git add -- data/federated/catalog.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: sync public repository documentation'
          git push origin HEAD:main
